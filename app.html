<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate Lab</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#0d1410; color:#e8f5ec; min-height:100vh; padding:18px 12px 50px; }
  .wrap { max-width:560px; margin:0 auto; }
  header { text-align:center; margin-bottom:10px; }
  header h1 { font-size:26px; }
  header .tag { color:#6f9a7f; font-size:12px; }
  a { color:#4ade80; text-decoration:none; }
  .bar { display:flex; gap:8px; justify-content:center; margin-bottom:10px; }
  .pill { background:#152a1c; border:1px solid #234a2e; color:#9fd4af; border-radius:999px; padding:7px 16px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .pill.on { background:#4ade80; color:#0d1410; border-color:#4ade80; }
  .hud { display:flex; justify-content:center; gap:26px; margin-bottom:8px; font-variant-numeric:tabular-nums; }
  .hud .c { text-align:center; }
  .hud .v { font-size:21px; font-weight:800; }
  .hud .k { font-size:10px; color:#6f9a7f; text-transform:uppercase; letter-spacing:1px; }
  #board { display:flex; justify-content:center; }
  svg { width:100%; max-width:460px; height:auto; }
  .gate { cursor:pointer; }
  .gate rect { fill:#1c3a26; stroke:#2e5a3c; stroke-width:2; rx:10; }
  .gate:hover rect { stroke:#4ade80; }
  .gate text { fill:#e8f5ec; font-size:15px; font-weight:700; text-anchor:middle; pointer-events:none; }
  .sw { cursor:pointer; }
  .sw circle { fill:#152a1c; stroke:#2e5a3c; stroke-width:2; }
  .sw.on circle { fill:#4ade80; stroke:#4ade80; }
  .sw text { font-size:15px; font-weight:800; text-anchor:middle; pointer-events:none; fill:#9fd4af; }
  .sw.on text { fill:#0d1410; }
  .swlab { fill:#6f9a7f; font-size:11px; text-anchor:middle; }
  .wire { stroke:#234a2e; stroke-width:3; fill:none; }
  .wire.lit { stroke:#4ade80; }
  .lampglow { fill:#223026; stroke:#2e5a3c; stroke-width:2; }
  .lampglow.on { fill:#fbbf24; stroke:#fbbf24; filter:drop-shadow(0 0 10px rgba(251,191,36,.7)); }
  #msg { text-align:center; min-height:24px; margin-top:10px; font-size:15px; font-weight:700; }
  .tools { display:flex; justify-content:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .best { color:#6f9a7f; font-size:11.5px; text-align:center; margin-top:8px; }
  .note { text-align:center; color:#4a6353; font-size:11.5px; margin-top:14px; line-height:1.6; }
  #legend { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; }
  #legend span { font-size:10.5px; color:#9fd4af; background:#152a1c; border:1px solid #234a2e; border-radius:6px; padding:3px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>&#9889; Gate Lab</h1><div class="tag">three switches, three gates, one lamp. Click anything.</div></header>
  <div class="bar">
    <button class="pill on" id="mSandbox">Sandbox</button>
    <button class="pill" id="mChallenge">Challenge</button>
  </div>
  <div class="hud" id="hud" style="visibility:hidden">
    <div class="c"><div class="v" id="streak">0</div><div class="k">streak</div></div>
    <div class="c"><div class="v" id="round">1</div><div class="k">round</div></div>
  </div>
  <div id="board"></div>
  <div id="msg"></div>
  <div class="tools"><button class="pill" id="action" style="display:none">Test circuit</button><button class="pill" id="next" style="display:none">Next challenge</button></div>
  <div class="best" id="best"></div>
  <div id="legend"></div>
  <div class="note">Sandbox: click switches and gates to rewire live. Challenge: one gate is a mystery - pick the type that hits the target.<br><a href="index.html">about</a></div>
</div>
<script src="engine.js?v=2"></script>
<script>
var BEST_KEY='gatelab-best-v1';
var S={mode:'sandbox', inputs:[true,false,true], types:['AND','OR','XOR'], ch:null, streak:0, round:1, solved:false};
function $(id){return document.getElementById(id);}
function best(){ try{return +localStorage.getItem(BEST_KEY)||0;}catch(_){return 0;} }
function saveBest(v){ try{localStorage.setItem(BEST_KEY,v);}catch(_){}}
function cur(){
  if(S.mode==='sandbox') return evalCircuit(S.types,S.inputs);
  var t=S.ch.types.slice(); t[S.ch.slot]=S.mystery;
  return evalCircuit(t,S.ch.inputs);
}
function wire(cls,lit){ return 'class="wire'+(lit?' lit':'')+'"'; }
function render(){
  var r=cur();
  var ch=S.mode==='challenge';
  var inp=ch?S.ch.inputs:S.inputs;
  var t=ch?S.ch.types.slice():S.types.slice();
  var mys=ch?S.ch.slot:-1;
  if(ch) t[mys]=S.mystery;
  var g1=r.g1,g2=r.g2,out=r.out;
  var s='<svg viewBox="0 0 420 330">';
  /* wires switches->gates */
  s+='<path '+wire(0,inp[0])+' d="M60,58 L60,132 L95,132"/>';
  s+='<path '+wire(0,inp[1])+' d="M210,58 L210,132 L245,132"/>';
  s+='<path '+wire(0,inp[1])+' d="M210,132 L210,148 L175,148"/>';
  s+='<circle cx="210" cy="132" r="4" fill="'+(inp[1]?'#4ade80':'#234a2e')+'"/>';
  s+='<path '+wire(0,inp[2])+' d="M360,58 L360,148 L325,148"/>';
  /* wires g1,g2 -> g3 */
  s+='<path '+wire(0,g1)+' d="M135,160 L135,235 L170,235"/>';
  s+='<path '+wire(0,g2)+' d="M285,160 L285,235 L250,235"/>';
  /* wire g3 -> lamp */
  s+='<path '+wire(0,out)+' d="M210,255 L210,282"/>';
  /* switches */
  var sx=[60,210,360], names=['A','B','C'];
  for(var i=0;i<3;i++){
    s+='<text class="swlab" x="'+sx[i]+'" y="30">'+names[i]+'</text>';
    s+='<g class="sw'+(inp[i]?' on':'')+'" data-sw="'+i+'"><circle cx="'+sx[i]+'" cy="48" r="17"/><text x="'+sx[i]+'" y="53">'+(inp[i]?'1':'0')+'</text></g>';
  }
  /* gates */
  var gx=[95,245,170], gy=[120,120,215];
  for(var g=0;g<3;g++){
    var label=(ch&&g===mys)?'?':t[g];
    s+='<g class="gate" data-g="'+g+'"><rect x="'+gx[g]+'" y="'+gy[g]+'" width="80" height="40" rx="10"/><text x="'+(gx[g]+40)+'" y="'+(gy[g]+25)+'">'+label+'</text></g>';
  }
  /* output dots */
  s+='<circle cx="135" cy="140" r="4" fill="'+(g1?'#4ade80':'#234a2e')+'"/>';
  s+='<circle cx="285" cy="140" r="4" fill="'+(g2?'#4ade80':'#234a2e')+'"/>';
  /* lamp */
  s+='<circle class="lampglow'+(out?' on':'')+'" cx="210" cy="300" r="17"/>';
  if(ch&&S.solved===false){
    s+='<text x="210" y="326" style="fill:#6f9a7f;font-size:11px;text-anchor:middle">target: lamp '+(S.ch.target?'ON':'OFF')+'</text>';
  }
  s+='</svg>';
  $('board').innerHTML=s;
  document.querySelectorAll('.sw').forEach(function(el){ el.onclick=function(){ if(ch)return; var i=+el.dataset.sw; S.inputs[i]=!S.inputs[i]; render(); }; });
  document.querySelectorAll('.gate').forEach(function(el){ el.onclick=function(){ gateTap(+el.dataset.g); }; });
  $('streak').textContent=S.streak;
  $('round').textContent=S.round;
  $('best').textContent=best()?('best streak: '+best()):'';
}
function gateTap(g){
  if(S.mode==='sandbox'){
    var i=GATE_NAMES.indexOf(S.types[g]);
    S.types[g]=GATE_NAMES[(i+1)%GATE_NAMES.length];
    render();
  } else if(g===S.ch.slot && !S.solved){
    var i2=GATE_NAMES.indexOf(S.mystery);
    S.mystery=GATE_NAMES[(i2+1)%GATE_NAMES.length];
    render();
  }
}
function legend(){
  var s='';
  var rows=[['AND','both on'],['OR','either on'],['XOR','exactly one'],['NAND','not both'],['NOR','neither'],['XNOR','both same']];
  rows.forEach(function(r){ s+='<span>'+r[0]+': '+r[1]+'</span>'; });
  $('legend').innerHTML=s;
}
function setMode(m){
  S.mode=m;
  $('mSandbox').classList.toggle('on',m==='sandbox');
  $('mChallenge').classList.toggle('on',m==='challenge');
  $('hud').style.visibility=m==='challenge'?'visible':'hidden';
  $('action').style.display=m==='challenge'?'inline-block':'none';
  $('next').style.display='none';
  $('msg').textContent='';
  if(m==='challenge'){ S.streak=0; S.round=1; newChallenge(); }
  render();
}
function newChallenge(){
  S.ch=makeChallenge();
  S.mystery='AND';
  S.solved=false;
  $('next').style.display='none';
  $('action').style.display='inline-block';
  $('msg').textContent='';
}
$('action').onclick=function(){
  if(S.solved) return;
  if(answerCorrect(S.ch,S.mystery)){
    S.solved=true;
    S.streak++;
    if(S.streak>best()) saveBest(S.streak);
    var multi=S.ch.accepts.length>1?' ('+S.ch.accepts.length+' gate types worked)':'';
    $('msg').textContent='Correct! Lamp '+(S.ch.target?'on':'off')+' as required.'+multi;
    $('action').style.display='none';
    $('next').style.display='inline-block';
  } else {
    S.streak=0;
    $('msg').textContent='Nope - that gives lamp '+(cur().out?'ON':'OFF')+'. Streak reset.';
  }
  render();
};
$('next').onclick=function(){ S.round++; newChallenge(); render(); };
$('mSandbox').onclick=function(){ setMode('sandbox'); };
$('mChallenge').onclick=function(){ setMode('challenge'); };
legend();
render();
</script>
</body>
</html>
